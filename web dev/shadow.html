<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box1{
            width: 200px;
            height: 200px;
            box-shadow: 10px 10px 5px black;
        }
        .box2{
            width: 200px;
            height: 200px;
            box-shadow: inset 0px 0px 15px 10px gray;
            justify-content: center;
            display: flex;
            align-items: center;
        }
        .box2>p{
            text-align: center;
            text-shadow: 3px ;
        }
        .box3{
            width: 300px;
            height: 200px;
            background-image: url('WhatsApp_Image_2026-08-24_at_2.49.05_PM-removebg-preview.png');
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
            filter: drop-shadow(3px 0 10px red );
        }
        .text{
            text-decoration: line-through;
            text-shadow: 10cm;
            text-align: center;
            font-family: 'Courier New', Courier, monospace;
            font-size: xx-large;
            font-weight: 800;
            color: blue;
            letter-spacing: 5px;
            word-spacing: 20px;
            text-decoration-color:black;
            text-indent: 15%;
            line-height: 2em;
        }
    </style>
</head>
<body>
    <div class="box1"></div>
    <br>
    <br>
    <div class="box2">
        <p>Dhruv kaushik</p>
    </div>
    <br>
    <br>
    <div class="box3"></div>
    <br>
    <br>
    <br>
    <br>

    <p class="text">Hello World</p>
</body>
</html>
