<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
        display: flex;
        justify-content: center;   
        align-items: center;       
        height: 100vh;             
        margin: 0;                 
        }

        .container {
            display: flex;
            justify-content: center;
            border: 2px solid;
            flex-direction: column;
            width: 300px;
            align-items: center;
            height: 300px;
            background: #f9f9f9;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        input {
            margin: 8px 0;
            padding: 8px;
            width: 80%;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        input:focus {
            border-color: dodgerblue;
            outline: none;
        }
        button {
            margin-top: 10px;
            padding: 10px 20px;
            background: dodgerblue;
            color: white;
            border:     qqnone;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background: navy;
        }

    </style>
</head>
<body>
    <form class="container">
      <h3>LOGIN</h3>

      <label for="username">Username</label>
      <input type="text" id="username" name="username" required>

      <label for="password">Password</label>
      <input type="password" id="password" name="password" required>

      <button type="submit">Login</button>
    </form>
</body>
</html>
