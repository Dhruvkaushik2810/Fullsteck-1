<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            width: 200px;
            height: 300px;
            background-image: linear-gradient(to bottom, yellow,brown);
            border:0px;
            box-shadow: 10px 10px 10px lightblue;
            border-radius: 3px;
        }
        p{
            color: transparent;
            font-size: 80px;
            font-weight: 300;
            background: linear-gradient(to bottom, yellow,brown);
            background-clip:text;
        }
        .dhruv{
            width: 200px;
            height: 300px;
            border: 1px;
            background-image: radial-gradient(circle,yellow,brown);
            box-shadow: 10px 10px 10px lightblue;
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <div class="box"></div>
    <p>BOX</p>
    <div class="dhruv"></div>
</body>
</html>
