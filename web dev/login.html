<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.  <title>Login</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f5f5f5;
    }

        nav {
      padding: 15px 30px;
      color: white;
      background-color: #4caf50;
    }

    nav a {
      margin-right: 20px;
      color: white;
      text-decoration: none;
    }

    .box {
      display: flex;
      justify-content: center;
      padding: 50px 20px;
    }

    .container {
      width: 300px;
      padding: 30px;
      background-color: white;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    h3 {
      margin-top: 0;
      text-align: center;
    }

    label {
      display: block;
      margin: 15px 0 6px;
    }

    input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 10px;
      color: white;
      background-color: #4caf50;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    button:hover {
      background-color: #45a049;
    }
  </style>
</head>
<body>
  <nav>
    <a href="#">Home</a>
    <a href="#">About</a>
    <a href="#">Contact</a>
  </nav>

iv class="box">

      <h3>LOGIN</h3>

      <label for="username">Username</label>
      <input type="text" id="username" name="username" required>

      <label for="password">Password</label>
      <input type="password" id="password" name="password" required>

      <button type="submit">Login</button>
    </form>
  </div>

</html>
